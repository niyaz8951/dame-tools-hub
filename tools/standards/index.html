<!doctype html>
<html lang="en" data-loading>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Standards - DAME Tools Hub</title>
<link rel="icon" href="../../assets/favicon.svg">
<link rel="stylesheet" href="../../assets/css/theme.css">
<link rel="stylesheet" href="standards.css">
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/hub.js"></script>
<script src="standards-data.js"></script>
<script src="std.js"></script>
</head>
<body>
<header id="topbar"></header>
<main class="page">
  <div class="page-head">
    <p class="small"><a id="back" href="../../dashboard.html">&larr; Dashboard</a></p>
    <h1>Standards</h1>
    <p>Short summaries of the standards named in AHU, FCU and chiller specifications.</p>
  </div>

  <div class="card stack">
    <div class="st-controls">
      <label class="field"><span>Search</span>
        <input class="input" id="q" type="search" placeholder="Number, name or word, e.g. 1886, filter, leakage" autocomplete="off">
      </label>
      <label class="field"><span>Topic</span>
        <select class="input" id="group"></select>
      </label>
    </div>
    <div class="row" style="justify-content:space-between">
      <div class="st-chips" id="products" role="group" aria-label="Product"></div>
      <button type="button" class="btn ghost sm" id="specToggle" aria-expanded="false">Check a specification</button>
    </div>

    <div class="st-spec stack" id="specPanel" hidden>
      <label class="field"><span>Paste the reference standards clause, or the whole specification text</span>
        <textarea class="input" id="specText" spellcheck="false" placeholder="Example: Casing to EN 1886 class D1/L1/T2/TB2. Coils rated to AHRI 410. Filters ISO 16890 ePM1 60%. Insulation to NFPA 90A and ASTM E84."></textarea>
        <span class="hint">The text is read on this PC only. Nothing is saved or sent.</span>
      </label>
      <div class="row">
        <button type="button" class="btn sm" id="specRun">Find standards in this text</button>
        <button type="button" class="btn ghost sm" id="specClear" hidden>Show all standards</button>
      </div>
      <div class="notice warn" id="specError" role="alert" hidden></div>
      <div class="notice" id="specResult" hidden></div>
    </div>
  </div>

  <div class="st-bar">
    <p class="muted small" id="count" role="status"></p>
    <button type="button" class="btn ghost sm" id="reset" hidden>Clear search and filters</button>
  </div>
  <div id="list"></div>
  <p class="muted small" style="margin-top:28px">These pages are summaries for quick reference. They do not replace the standard. Always check the edition the specification names.</p>
</main>
<script>
(function () {
  "use strict";
  var el = Hub.el, STORE = "std-filters";
  var state = { q: "", group: "", product: "", spec: null };       // spec = list of ids found in pasted text
  try { var saved = JSON.parse(sessionStorage.getItem(STORE) || "null"); if (saved) { state.q = saved.q || ""; state.group = saved.group || ""; state.product = saved.product || ""; } } catch (e) {}
  function remember() { try { sessionStorage.setItem(STORE, JSON.stringify({ q: state.q, group: state.group, product: state.product })); } catch (e) {} }

  var $ = function (id) { return document.getElementById(id); };

  function haystack(s) {
    return [s.code, s.title, s.body, s.covers, s.spec, (s.keys || []).join(" "), (s.points || []).join(" "), Std.groupName[s.group]].join(" ").toLowerCase();
  }
  // "en1886" and "ahri410" are matched against the names only, each on its own, so "90a" cannot
  // be made up from the end of one word and the start of the next.
  function flatNames(s) {
    return [s.code].concat(s.keys || []).map(function (k) { return k.toLowerCase().replace(/[\s\-\/.]/g, ""); }).join("|");
  }
  var index = STD.ITEMS.map(function (s) { return { s: s, text: haystack(s), flat: flatNames(s) }; });

  function hasWord(row, w) {
    return row.text.indexOf(w) >= 0 || row.flat.indexOf(w.replace(/[\-\/.]/g, "")) >= 0;
  }
  function matches(row) {
    var s = row.s;
    if (state.spec && state.spec.indexOf(s.id) < 0) return false;
    if (state.group && s.group !== state.group) return false;
    if (state.product && (s.products || []).indexOf(state.product) < 0) return false;
    var words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    return words.every(function (w) {
      if (hasWord(row, w)) return true;
      var part = /^(.*\d)[\-\/:]\d{1,4}$/.exec(w);              // "16890-1", "1886:2007": try the number without the part or year
      return !!part && hasWord(row, part[1]);
    });
  }

  function render() {
    var host = $("list"); host.textContent = "";
    var rows = index.filter(matches), n = rows.length;
    $("count").textContent = n === STD.ITEMS.length ? n + " standards" : n + " of " + STD.ITEMS.length + " standards";
    $("reset").hidden = !(state.q || state.group || state.product);
    if (!n) {
      host.appendChild(el("div", { "class": "empty" }, [
        el("p", { text: "No standard matches." }),
        el("p", { "class": "small", text: "Try the number alone, for example 1886, or clear the filters." })
      ]));
      return;
    }
    STD.GROUPS.forEach(function (g) {
      var items = rows.filter(function (r) { return r.s.group === g.id; });
      if (!items.length) return;
      host.appendChild(el("section", { "class": "st-group" }, [
        el("h2", {}, [g.name + " ", el("span", { text: "(" + items.length + ")" })]),
        el("div", { "class": "grid" }, items.map(function (r) { return Std.tile(r.s, "standard.html#" + r.s.id); }))
      ]));
    });
  }

  function chips() {
    var host = $("products"); host.textContent = "";
    [["", "All products"], ["ahu", "AHU"], ["fcu", "FCU"], ["chiller", "Chiller"]].forEach(function (p) {
      host.appendChild(el("button", { type: "button", "class": "st-chip", "aria-pressed": String(state.product === p[0]), text: p[1],
        onclick: function () { state.product = p[0]; remember(); chips(); render(); } }));
    });
  }

  function specDone() {
    state.spec = null; $("specResult").hidden = true; $("specClear").hidden = true; $("specError").hidden = true; render();
  }

  function specRun() {
    var text = $("specText").value, err = $("specError"), res = $("specResult");
    err.hidden = true; res.hidden = true;
    if (text.trim().length < 8) { err.textContent = "Paste some specification text first."; err.hidden = false; $("specText").focus(); return; }
    var out = Std.scan(text);
    state.spec = out.found.map(function (s) { return s.id; });
    res.textContent = "";
    res.appendChild(el("p", {}, [el("strong", { text: out.found.length + (out.found.length === 1 ? " standard" : " standards") + " from the library found in the text." }),
      out.found.length ? (out.found.length === 1 ? " It is listed below." : " They are listed below.") : " Nothing in the text matches the library."]));
    if (out.missing.length) {
      res.appendChild(el("p", { style: "margin-top:8px", text: out.missing.length + " more named in the text that the library does not have yet:" }));
      res.appendChild(el("ul", { "class": "st-miss" }, out.missing.map(function (m) { return el("li", { text: m }); })));
    }
    res.hidden = false; $("specClear").hidden = false;
    state.q = ""; state.group = ""; state.product = ""; $("q").value = ""; $("group").value = ""; remember(); chips(); render();
  }

  Hub.requireLogin({ tool: Std.TOOL_ID }).then(function (profile) {
    var b = Std.backLink(profile), a = $("back"); a.href = b.href; a.textContent = "← " + b.text;

    var sel = $("group");
    sel.appendChild(el("option", { value: "", text: "All topics" }));
    STD.GROUPS.forEach(function (g) { sel.appendChild(el("option", { value: g.id, text: g.name })); });
    sel.value = state.group; $("q").value = state.q;

    $("q").addEventListener("input", function () { state.q = this.value; remember(); render(); });
    sel.addEventListener("change", function () { state.group = this.value; remember(); render(); });
    $("reset").addEventListener("click", function () { state.q = ""; state.group = ""; state.product = ""; $("q").value = ""; sel.value = ""; remember(); chips(); render(); });
    $("specToggle").addEventListener("click", function () {
      var p = $("specPanel"); p.hidden = !p.hidden; this.setAttribute("aria-expanded", String(!p.hidden));
      if (p.hidden) specDone(); else $("specText").focus();
    });
    $("specRun").addEventListener("click", specRun);
    $("specClear").addEventListener("click", specDone);

    chips(); render();
  });
})();
</script>
</body>
</html>
