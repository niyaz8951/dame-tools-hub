<!doctype html>
<html lang="en" data-loading>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Specification - DAME Tools Hub</title>
<link rel="icon" href="../../assets/favicon.svg">
<link rel="stylesheet" href="../../assets/css/theme.css">
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/hub.js"></script>
<style>
  .rc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .rc-facts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .rc-progress { height: 3px; border-radius: 2px; background: var(--surface-2); overflow: hidden; flex: 1 0 100%; margin: 0 2px -2px; }
  .rc-progress i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }
  .rc th:nth-child(1) { width: 62px; } .rc th:nth-child(3) { width: 170px; } .rc th:nth-child(4) { width: 23%; } .rc th:nth-child(5) { width: 18%; } .rc th:nth-child(6) { width: 104px; }
  .rc tr.lib .input { background: var(--ok-bg); }
  .rc tr.lib td.read { color: var(--ok); }
  .rc .state.err { color: var(--danger); }
  .mode-seg { flex: 0 0 auto; } .mode-seg .tab { min-width: 64px; }
  .rc-sheet { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .rc-chip { display: inline-flex; align-items: baseline; gap: 6px; max-width: 100%; font: inherit; font-size: 13px; text-align: left; cursor: pointer;
             padding: 3px 10px; border-radius: 999px; color: var(--text); background: color-mix(in srgb, var(--brand) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--brand) 30%, transparent); }
  .rc-chip b { font-weight: 650; color: var(--brand); } .rc-chip span { overflow-wrap: anywhere; }
  .rc-chip:hover { border-color: var(--brand); }
  .rc-notes { margin: 0 0 12px; } .rc-notes .hint { margin: 0 0 2px; }
</style>
</head>
<body>
<header id="topbar"></header>
<main class="page wide">
  <div class="empty" id="rc-loading">Loading the specification…</div>
  <div class="notice error" id="rc-error" role="alert" hidden></div>

  <div id="rc-main" hidden>
    <div class="page-head" style="margin-bottom:14px">
      <h1 id="rc-name"></h1>
      <div class="rc-facts" id="rc-facts"></div>
    </div>

    <!-- the work bar: stays under the top bar, slides away while reading down, comes back on the way up -->
    <div class="workbar" id="rc-workbar">
      <select class="input" id="rc-show" aria-label="Show">
        <option value="all">All rows</option>
        <option value="open">To fill</option>
        <option value="filled">Filled</option>
        <option value="review">Waiting for review</option>
      </select>
      <input class="input grow" id="rc-q" type="search" placeholder="Find a word in the specification" aria-label="Find" autocomplete="off">
      <span class="count" id="rc-count" role="status"></span>
      <div class="tabs mode-seg" id="rc-seg" role="group" aria-label="Read or edit"><button type="button" class="tab" data-mode="read" aria-selected="true">Read</button><button type="button" class="tab" data-mode="edit" aria-selected="false">Edit</button></div>
      <button type="button" class="btn" id="rc-focus">Focus mode</button>
      <button type="button" class="btn ghost" id="rc-download">Download Excel</button>
      <div class="rc-progress" aria-hidden="true"><i id="rc-bar"></i></div>
    </div>

    <div class="rc-notes">
      <p class="hint" id="rc-mode"></p>
      <p class="hint" id="rc-sheet-note" hidden></p>
    </div>
    <div class="empty" id="rc-empty" hidden>No row matches.</div>
    <div class="table-wrap sheet-wrap" id="rc-wrap">
      <table class="table sheet rc">
        <thead><tr><th>Sr</th><th>Specifications</th><th>Compliance</th><th>Remarks</th><th>Internal Comments</th><th></th></tr></thead>
        <tbody id="rc-body"></tbody>
      </table>
    </div>
    <datalist id="rc-words"><option value="Comply"><option value="Comply with Remarks"><option value="Noted"><option value="Not Comply"><option value="Not Applicable"><option value="In Contractor's Scope"></datalist>
  </div>
</main>

<script src="../compliance-maker/cm-highlight.js"></script>
<script src="../compliance-maker/cm-focus.js"></script>
<script src="../compliance-maker/xlsx-writer.js"></script>
<script src="../compliance-maker/cm-rows.js"></script>
<script src="pr-xlsx.js"></script>
<script src="pr-options.js"></script>
<script src="pr-match.js"></script>
<script>
(function () {
  "use strict";
  var el = Hub.el, $ = function (id) { return document.getElementById(id); };
  var runId = Hub.param("run"), run = null, lines = [], editing = false, match = null, sheetOf = {};

  function when(iso) { var d = new Date(iso); return isNaN(d) ? "" : Hub.date(iso); }
  function bare(name) { return String(name || "").replace(/\.[A-Za-z0-9]{1,5}$/, "") || "Pasted text"; }
  // what the row holds now: the project's own answer, or the library's
  function shown(l) { return l.own ? { c: l.compliance, r: l.remarks } : { c: l.lib_compliance, r: l.lib_remarks }; }
  function filled(l) { var s = shown(l); return !!(s.c || s.r); }
  function stateText(l) {
    if (!l.own) return filled(l) ? "From the library" : "";
    return l.review === "pending" ? "Saved, in review" : l.review === "approved" ? "Saved, approved" : l.review === "rejected" ? "Saved, project only" : "Saved";
  }

  function counts() {
    var can = lines.filter(function (l) { return l.can; }), done = can.filter(filled).length, rev = can.filter(function (l) { return l.own && l.review === "pending"; }).length;
    $("rc-count").textContent = done + " of " + can.length + " clauses filled" + (rev ? ", " + rev + " waiting for review" : "") + ".";
    $("rc-bar").style.width = (can.length ? Math.round(100 * done / can.length) : 0) + "%";
  }

  /* Save one clause. Back to exactly the library answer, or both boxes emptied: no own answer is kept. */
  function saveLine(l, c, r) {
    var same = c === l.lib_compliance && r === l.lib_remarks;
    return Api.prRunSaveLine(Hub.token(), { run: runId, seq: l.seq, compliance: same ? "" : c, remarks: same ? "" : r }).then(function (res) {
      l.own = !same && !!(c || r); l.compliance = l.own ? c : ""; l.remarks = l.own ? r : ""; l.review = res.review || "";
    });
  }

  /* Full screen, one clause at a time (cm-focus.js). Opens on the first clause still to fill. */
  function focusMode() {
    var part = "", sect = "", items = [];
    lines.forEach(function (l) {
      if (l.type === "part") { part = l.spec; sect = ""; return; }
      if (l.type === "section") { sect = (l.sr ? l.sr + " " : "") + l.spec; return; }
      if (!l.can) return;
      var s = shown(l);
      items.push({ line: l, part: part, section: sect, sr: l.sr, spec: l.spec, compliance: s.c, remarks: s.r, info: stateText(l), lib: !l.own && filled(l),
                   others: (l.lib_comments ? ["Internal comment · " + l.lib_comments] : []).concat((sheetOf[lines.indexOf(l)] || []).map(function (d) { return "Datasheet · " + d.component + ": " + valueText(d.cells); })) });
    });
    var first = 0; for (var k = 0; k < items.length; k++) if (!filled(items[k].line)) { first = k; break; }
    CMFocus.open({ title: bare(run.file_name), items: items, start: first, choices: CHOICES,
      editing: editing, onMode: function (on) { setMode(on, true); },      // one mode for the page and the pane
      save: function (it, v) {
        return saveLine(it.line, v.compliance, v.remarks).then(function () {
          var s = shown(it.line); it.compliance = s.c; it.remarks = s.r; it.lib = !it.line.own && filled(it.line); it.info = stateText(it.line);
          return { info: it.line.own && it.line.review === "pending" ? "sent for review" : "", lib: it.lib };
        });
      },
      onClose: function () { counts(); draw(); } });
  }
  var CHOICES = ["Comply", "Comply with Remarks", "Noted", "Not Comply", "Not Applicable", "In Contractor's Scope"];

  function row(l) {
    if (l.type === "part") return el("tr", { "class": "part" }, [el("td", { "class": "sr" }), el("td", { colspan: "5", text: l.spec })]);
    if (l.type === "section") return el("tr", { "class": "sect" }, [el("td", { "class": "sr", text: l.sr }), el("td", { colspan: "5", text: l.spec })]);
    var text = el("div", { "class": "spec" }, CMHighlight.runs(l.spec).map(function (r) { return r.style ? el("span", { "class": "hl-" + r.style, text: r.text }) : r.text; }));
    var kind = l.type === "letter" && /^[A-Z]/.test(l.sr || "") ? "letter" : l.type === "number" ? "number" : "";
    if (!l.can) return el("tr", { "class": "line" }, [el("td", { "class": "sr " + kind, text: l.sr }), el("td", { colspan: "5" }, [text])]);

    var s = shown(l), sheet = sheetOf[lines.indexOf(l)] || [];
    // what the datasheet has for the rows this clause is about (found by the row keywords)
    var chips = sheet.length ? el("div", { "class": "rc-sheet" }, sheet.map(function (d) {
      return el("button", { type: "button", "class": "rc-chip", title: "From the datasheet. Press to see what the factory offers for this row.", onclick: function () {
        PROptions.open({ productId: run.product_id, product: run.product, factory: match.factory, key: d.key, section: d.section, component: d.component, values: d.cells });
      } }, [el("b", { text: d.component }), el("span", { text: valueText(d.cells) })]);
    })) : null;
    var state = el("span", { "class": "state", text: stateText(l) });

    // read: plain text, so the page can be searched (Ctrl+F) and read like the document
    if (!editing) {
      return el("tr", { "class": "line" + (!l.own && filled(l) ? " lib" : "") }, [
        el("td", { "class": "sr " + kind, text: l.sr }), el("td", {}, [text, chips]),
        el("td", { "class": "read", "data-label": "Compliance", text: s.c }), el("td", { "class": "read", "data-label": "Remarks", text: s.r }),
        el("td", { "class": "note", "data-label": "Internal Comments", text: l.lib_comments || "" }),
        el("td", { "class": "end" }, stateText(l) ? [state] : [])
      ]);
    }
    var comp = el("input", { "class": "input", value: s.c, maxlength: "200", list: "rc-words", "aria-label": "Compliance" });
    var rem = el("textarea", { "class": "input", rows: "1", maxlength: "4000", "aria-label": "Remarks" }); rem.value = s.r; Hub.autoGrow(rem);
    var tr = el("tr", { "class": "line edit" + (!l.own && filled(l) ? " lib" : "") }, [
      el("td", { "class": "sr " + kind, text: l.sr }), el("td", {}, [text, chips]), el("td", { "data-label": "Compliance" }, [comp]), el("td", { "data-label": "Remarks" }, [rem]),
      el("td", { "class": "note", "data-label": "Internal Comments", text: l.lib_comments || "" }),
      el("td", { "class": "end" }, [state])
    ]);
    // Enter in Compliance goes to the next clause, so a run of answers is typed without the mouse
    comp.addEventListener("keydown", function (e) {
      if (e.key !== "Enter") return;
      e.preventDefault();
      var boxes = [].slice.call(document.querySelectorAll("#rc-body input[aria-label=Compliance]")), next = boxes[boxes.indexOf(comp) + 1];
      if (next) next.focus(); else comp.blur();
    });
    var busy = null;                                    // one save at a time; resolves true when the answer is stored
    function save() {
      if (busy) return pending = busy.then(save);
      var c = comp.value.trim(), r = rem.value.trim(), now = shown(l);
      if (c === now.c && r === now.r) return Promise.resolve(true);
      state.className = "state"; state.textContent = "Saving…";
      return pending = busy = saveLine(l, c, r).then(function () {
        busy = null;
        if (!l.own) { comp.value = l.lib_compliance; rem.value = l.lib_remarks; }
        tr.className = "line edit" + (!l.own && filled(l) ? " lib" : "");
        state.textContent = stateText(l); counts(); return true;
      }, function (err) { busy = null; state.className = "state err"; state.textContent = "Not saved"; Hub.toast(err.message, true); return false; });
    }
    comp.addEventListener("change", save); rem.addEventListener("change", save);
    comp.addEventListener("blur", save); rem.addEventListener("blur", save);
    return tr;
  }
  function valueText(cells) {
    var seen = [], out = [];
    (cells || []).forEach(function (v) { v = String(v || "").trim(); if (v && v !== "-" && seen.indexOf(v.toLowerCase()) < 0) { seen.push(v.toLowerCase()); out.push(v); } });
    return out.length ? out.slice(0, 3).join(" / ") + (out.length > 3 ? " and " + (out.length - 3) + " more" : "") : "not on the datasheet";
  }

  /* Headings are kept only when a row under them is shown. */
  function draw() {
    var show = $("rc-show").value, q = $("rc-q").value.trim().toLowerCase(), body = $("rc-body"), frag = document.createDocumentFragment();
    var plain = show === "all" && !q, part = null, sect = null, n = 0;
    lines.forEach(function (l) {
      if (l.type === "part") { part = l; sect = null; if (plain) frag.appendChild(row(l)); return; }
      if (l.type === "section") { sect = l; if (plain) frag.appendChild(row(l)); return; }
      if (!plain) {
        if (!l.can && show !== "all") return;
        if (show === "open" && filled(l)) return;
        if (show === "filled" && !filled(l)) return;
        if (show === "review" && !(l.own && l.review === "pending")) return;
        if (q && l.spec.toLowerCase().indexOf(q) < 0) return;
        if (part) { frag.appendChild(row(part)); part = null; }
        if (sect) { frag.appendChild(row(sect)); sect = null; }
      }
      frag.appendChild(row(l)); n++;
    });
    body.textContent = ""; body.appendChild(frag);
    $("rc-wrap").hidden = !n; $("rc-empty").hidden = !!n;
  }
  var timer;
  $("rc-show").addEventListener("change", draw);
  $("rc-q").addEventListener("input", function () { clearTimeout(timer); timer = setTimeout(draw, 200); });

  $("rc-focus").addEventListener("click", focusMode);
  // Edit on: every clause shows its boxes. Edit off: the page reads like the document.
  function setMode(on, quiet) {
    editing = !!on;
    [].forEach.call($("rc-seg").children, function (b) { b.setAttribute("aria-selected", String((b.getAttribute("data-mode") === "edit") === editing)); });
    $("rc-mode").textContent = editing ? "Edit is on. Every change saves as you leave the box; Enter in Compliance goes to the next clause. Green boxes are answers from the company library; empty both boxes to go back to the library answer."
                                       : "Reading. Switch to Edit to fill or change answers, or Focus mode for one clause at a time. Green answers come from the company library. Internal Comments are notes from the library team for you, not for the client.";
    if (!quiet) settled().then(draw, draw);          // a box that was just left is saved before the page is drawn again
  }
  var pending = Promise.resolve();
  function settled() { var p = pending; return p.then(function () { return p === pending ? null : settled(); }); }     // every save that is under way or queued
  $("rc-seg").addEventListener("click", function (e) { var b = e.target.closest(".tab"); if (b) setMode(b.getAttribute("data-mode") === "edit"); });
  /* Sheet 2 of the Excel: every datasheet row with the clause that asks about it and, when the
     project has the datasheet, what each unit has. Without a datasheet every mapped row is listed. */
  function sheet2() {
    if (!match || !match.table.length) return null;
    var s = "";
    var rows = match.hasNotes ? PRMatch.sheetRows(match, false)
      : match.table.map(function (r) { var first = r.section !== s; s = r.section; return { section: first ? r.section : "", component: r.component, text: r.spec, kind: r.kind, cells: [] }; });
    return rows.length ? { name: "Datasheet rows", columns: match.columns, rows: rows } : null;
  }
  $("rc-download").addEventListener("click", function () {
    var rows = lines.map(function (l) {
      var s = shown(l);
      return { type: l.type, sr: l.sr, spec: l.spec, compliance: l.can ? s.c : "", remarks: l.can ? s.r : "", internal: l.can ? l.lib_comments || "" : "", auto: l.can && !l.own && filled(l) ? { type: "exact" } : null };
    });
    var blob = window.xlsxWriter.build(rows, null, function (text) { return CMHighlight.runs(text); },
      { projectName: run.project, bandText: "Product : " + run.product + "     Factory : " + run.factory, sheet2: sheet2() });
    PRXlsx.save(blob, bare(run.file_name) + " - compliance.xlsx");
    Hub.toast("Excel downloaded.");
  });

  Hub.requireLogin({ tool: "projects" }).then(function () {
    Hub.setBack("Projects", "index.html");
    if (!runId) throw new Error("No specification was chosen.");
    return Promise.all([Api.prRunGet(Hub.token(), runId), CMHighlight.load()]);
  }).then(function (res) {
    run = res[0].run; lines = res[0].lines || [];
    Hub.setBack(run.project, "project.html?id=" + encodeURIComponent(run.project_id));
    document.title = bare(run.file_name) + " - DAME Tools Hub";
    $("rc-name").textContent = bare(run.file_name);
    var facts = $("rc-facts");
    [run.project, run.product + ", " + run.factory + " factory", "Converted by " + run.user + ", " + when(run.created_at)].forEach(function (t) { facts.appendChild(el("span", { "class": "badge", text: t })); });
    $("rc-loading").hidden = true; $("rc-main").hidden = false;
    setMode(false, true); counts(); draw();
    Hub.autoHide($("rc-workbar"));
    // the datasheet rows this specification talks about, and their values when the project has the datasheet
    PRMatch.load({ projectId: run.project_id, productId: run.product_id, specRows: lines.map(function (l) { return { type: l.type, sr: l.sr, spec: l.spec }; }) }).then(function (m) {
      match = m; sheetOf = {};
      m.table.forEach(function (r) { if (r.kind === "row" && r.found && m.hasNotes) r.lines.forEach(function (i) { (sheetOf[i] = sheetOf[i] || []).push(r); }); });
      var n = Object.keys(sheetOf).length, note = $("rc-sheet-note");
      note.hidden = false;
      note.textContent = !m.hasNotes ? "No " + run.product + " datasheet in this project yet. Read one and its values appear beside the clauses that ask about them; the Excel gets them on its second sheet."
        : n ? n + (n === 1 ? " clause has" : " clauses have") + " the datasheet value beside " + (n === 1 ? "it" : "them") + " (blue chips). Found by the row keywords, not by meaning: read before you rely on it."
        : "The datasheet is in the project, but no clause matched a row keyword. An editor adds keywords in Datasheet Notes > Row mapping.";
      if (n && !CMFocus.isOpen()) draw();
    }, function () { /* the specification still reads and fills without it */ });
    // on a phone the table is hard to fill: start in the full-screen mode, "Done" shows the table
    if (window.matchMedia("(max-width: 640px)").matches && lines.some(function (l) { return l.can; })) { setMode(true, true); focusMode(); }
  }, function (err) {
    $("rc-loading").hidden = true; $("rc-error").hidden = false;
    $("rc-error").textContent = ((err && err.message) || err) + " Go back to Projects and open it from the project page.";
  });
})();
</script>
</body>
</html>
