<!doctype html>
<html lang="en" data-loading>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard - DAME Tools Hub</title>
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/css/theme.css">
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/hub.js"></script>
</head>
<body>
<header id="topbar"></header>
<main class="page">
  <div class="page-head">
    <h1 id="hello">Dashboard</h1>
    <p>Pick a team tile to see its tools.</p>
  </div>
  <section class="grid" id="tiles" aria-label="Teams"></section>
  <section id="toolsSection" style="margin-top:32px" hidden>
    <div class="page-head"><h2 id="toolsTitle"></h2><p id="toolsSub"></p></div>
    <div class="grid" id="tools"></div>
  </section>
</main>
<script>
(function () {
  "use strict";
  var el = Hub.el, profile;
  var CAT_ICON = { general: Hub.ICON.grid, sales: Hub.ICON.chart, sbu: Hub.ICON.wrench };

  function selected() { return decodeURIComponent(location.hash.slice(1)); }

  function renderTiles() {
    var host = document.getElementById("tiles"); host.textContent = "";
    profile.categories.forEach(function (c) {
      var live = c.tools.filter(function (t) { return t.status === "live"; }).length;
      var meta = !c.allowed ? "Ask your admin for access"
               : c.tools.length === 0 ? "No tools yet"
               : live + " live, " + (c.tools.length - live) + " coming soon";
      var tile = el("button", {
        type: "button", "class": "tile" + (c.allowed ? "" : " locked") + (selected() === c.id ? " active" : ""),
        "aria-disabled": c.allowed ? null : "true", "aria-pressed": selected() === c.id ? "true" : "false",
        onclick: function () { if (c.allowed) location.hash = c.id; else Hub.toast("You do not have access to " + c.name + ". Ask your admin."); }
      }, [
        el("span", { "class": "tile-icon", "aria-hidden": "true", html: c.allowed ? (CAT_ICON[c.id] || Hub.ICON.grid) : Hub.ICON.lock }),
        c.allowed ? null : el("span", { "class": "badge", text: "Locked" }),
        el("h3", { text: c.name }),
        el("p", { text: c.description }),
        el("span", { "class": "meta", text: meta })
      ]);
      host.appendChild(tile);
    });
  }

  function renderTools() {
    var section = document.getElementById("toolsSection");
    var c = profile.categories.filter(function (x) { return x.id === selected() && x.allowed; })[0];
    section.hidden = !c; if (!c) return;
    document.getElementById("toolsTitle").textContent = c.name + " tools";
    document.getElementById("toolsSub").textContent = c.description;
    var host = document.getElementById("tools"); host.textContent = "";
    if (!c.tools.length) {
      host.appendChild(el("div", { "class": "empty", style: "grid-column:1/-1", text: "No tools have been added to " + c.name + " yet." }));
      return;
    }
    c.tools.forEach(function (t) {
      var isLive = t.status === "live" && t.path;
      host.appendChild(el(isLive ? "a" : "div", {
        "class": "tile" + (isLive ? "" : " disabled"), href: isLive ? Hub.url(t.path) : null
      }, [
        el("span", { "class": "tile-icon", "aria-hidden": "true", html: Hub.ICON.doc }),
        el("span", { "class": "badge " + (isLive ? "ok" : "warn"), text: isLive ? "Live" : "Coming soon" }),
        el("h3", { text: t.name }),
        el("p", { text: t.description })
      ]));
    });
  }

  function render() { renderTiles(); renderTools(); }

  Hub.requireLogin().then(function (p) {
    profile = p;
    document.getElementById("hello").textContent = "Welcome, " + p.user.full_name.split(" ")[0];
    render();
    window.addEventListener("hashchange", render);
  });
})();
</script>
</body>
</html>
