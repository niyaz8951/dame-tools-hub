<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Page not found - DAME Tools Hub</title>
<!-- Fallback look, used only if the theme below does not load. -->
<style>
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: Canvas; color: CanvasText; }
  main { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; text-align: center; }
</style>
<script>
/* GitHub Pages serves this file for any wrong address, at any folder depth, so relative
   paths cannot be used. On a project site the root is the first part of the path. */
(function () {
  "use strict";
  var part = window.location.pathname.split("/")[1];
  var root = /\.github\.io$/i.test(window.location.hostname) && part ? "/" + part + "/" : "/";
  var theme = null;
  try { theme = window.localStorage.getItem("dame_hub_theme"); } catch (e) { /* storage blocked */ }
  if (theme !== "dark" && theme !== "light") theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", theme);
  document.documentElement.style.colorScheme = theme;
  function link(rel, href) { var l = document.createElement("link"); l.rel = rel; l.href = root + href; document.head.appendChild(l); }
  link("icon", "assets/favicon.svg");
  link("stylesheet", "assets/css/theme.css");
  document.addEventListener("DOMContentLoaded", function () { document.getElementById("home").href = root + "dashboard.html"; });
})();
</script>
</head>
<body>
<main class="auth">
  <div class="card auth-card stack">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>DAME Tools Hub</span></div>
    <h1>Page not found</h1>
    <p class="muted">This address does not exist on the Tools Hub.</p>
    <p><a class="btn" id="home" href="dashboard.html">Go to the dashboard</a></p>
  </div>
</main>
</body>
</html>
